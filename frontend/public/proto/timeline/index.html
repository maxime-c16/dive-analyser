<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><title>Timeline</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080a0d;color:white;font-family:system-ui;height:100%;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;object-fit:contain}video{display:none}#primary{display:block}.bar{padding:12px 16px;display:grid;grid-template-columns:48px 48px minmax(0,1fr) 48px;align-items:center;gap:8px}button{border:0;background:#252b32;color:white;border-radius:24px;min-height:48px;min-width:0;font-size:20px;touch-action:manipulation}button:disabled{opacity:.35}#mark{background:#d4fd66;color:#111;font-weight:750;padding:0 14px;font-size:21px}#clock{position:absolute;z-index:3;top:12px;left:16px;padding:5px 9px;border-radius:8px;background:#080a0d88;font-variant-numeric:tabular-nums;font-size:16px}.modes{position:absolute;z-index:3;right:12px;top:12px;display:flex;padding:3px;border-radius:24px;background:#080a0dbb;gap:2px}.modes button{font-size:12px;min-height:30px;padding:0 12px;background:transparent}.modes button[aria-pressed=true]{background:#eee;color:#111}#speed{position:absolute;z-index:3;right:16px;bottom:12px;font-size:14px;min-height:40px;padding:0 18px;background:#252b32dd}#railbox{position:relative;height:94px;margin-bottom:12px}#railbox:after{content:'';position:absolute;left:50%;top:0;height:90px;width:2px;background:#d4fd66;pointer-events:none}#rail{height:94px;overflow-x:scroll;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}#track{position:relative;height:82px;margin-top:4px}.thumb{position:absolute;top:0;width:56px;height:80px;background-repeat:no-repeat}.dot{position:absolute;top:0;width:5px;height:82px;background:#d4fd66;z-index:2}.ruler{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff30 0 1px,transparent 1px 28px);height:18px;top:30px}#error{position:absolute;inset:0;display:none;place-items:center;background:#080a0d;padding:24px}@media(orientation:landscape){.bar{padding:5px 24px}#railbox{height:70px;margin-bottom:0}.thumb{height:56px}#rail{height:70px}#railbox:after{height:64px}}
</style><main><div class="stage"><video id="primary" playsinline preload="metadata"></video><video id="search" playsinline muted preload="auto"></video><canvas style="display:none"></canvas><span id="clock">0:00</span><div class="modes"><button id="imagesMode" aria-pressed="true" disabled>Images</button><button id="videoMode" aria-pressed="false" disabled>Vidéo</button></div><button id="speed" disabled>×30</button><div id="error"></div></div><div class="bar"><button id="play" aria-label="Lecture">▶</button><button id="prev" aria-label="Marque précédente">◀</button><button id="mark">Plongeon</button><button id="next" aria-label="Marque suivante">▶</button></div><div id="railbox"><div id="rail" aria-label="Timeline" tabindex="0"><div id="track"></div></div></div></main>
<script type="module">
const $=s=>document.querySelector(s),player=$('#primary'),search=$('#search'),canvas=$('canvas'),ctx=canvas.getContext('2d'),rail=$('#rail'),track=$('#track');
const params=new URLSearchParams(location.search),run=(params.get('test')==='webkit'?'webkit-':'')+(crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`);
let variant=params.get('variant')||localStorage.getItem('tl-variant')||'images',duration=1936.801667,index=null,images=[],imagesLoading=false,imagesReady=false,videoReady=false,miniLoading=false,miniLoadAt=0,config={},marks=[],current=0,scrubbing=false,fast=false,fallback=false,originalDecoded=false,kind='original',syncing=false,followToken=0,settleTimer,lastInput=0,releaseAt=0,searchRequest=null,searchPending=null,seekStarted=0,seekTarget=0,seekGeneration=0,pendingTime=null,waitingFrame=false,frameId=null,frameLast=0,watchdog=null,queue=[];
if(variant!=='video')variant='images';try{marks=JSON.parse(localStorage.getItem('tl-marks-1')||'[]').filter(Number.isFinite)}catch{}
function log(event,values={}){queue.push({elapsed:performance.now(),event,variant,speed:fast?30:1,ms:performance.now(),...values});if(queue.length>1000)queue.splice(0,queue.length-1000);if(queue.length>=40)flush()}
function flush(){if(!queue.length)return;const events=queue.splice(0,100);fetch('/api/timeline/metrics',{method:'POST',body:JSON.stringify({run,ua:navigator.userAgent,events}),keepalive:true}).catch(()=>{queue.unshift(...events);queue=queue.slice(-1000)})}
setInterval(flush,2000);addEventListener('pagehide',()=>navigator.sendBeacon('/api/timeline/metrics',JSON.stringify({run,ua:navigator.userAgent,events:queue.splice(0,100)})));
function sourceTime(){if(pendingTime!==null||player.seeking)return seekTarget;return Math.min(duration,player.currentTime*(kind==='fast'?30:1))}
function clock(){ $('#clock').textContent=`${Math.floor(current/60)}:${String(Math.floor(current%60)).padStart(2,'0')}` }
function position(t){return t*28+rail.clientWidth/2}
function follow(){const token=++followToken;syncing=true;rail.scrollLeft=current*28;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token===followToken)syncing=false}))}
function nearest(t){let lo=0,hi=index.times.length-1;while(lo<hi){const m=Math.ceil((lo+hi)/2);if(index.times[m]<=t)lo=m;else hi=m-1}return lo}
function dots(){track.querySelectorAll('.dot').forEach(e=>e.remove());for(const t of marks){const d=document.createElement('i');d.className='dot';d.style.left=position(t)+'px';track.append(d)}$('#prev').disabled=!marks.some(t=>t<current-.2);$('#next').disabled=!marks.some(t=>t>current+.2)}
function renderTrack(){track.replaceChildren();track.style.width=duration*28+rail.clientWidth+'px';if(variant==='images'&&imagesReady){for(let t=0;t<duration;t+=2){const i=nearest(t),d=document.createElement('div'),c=index.content,scale=80/c.height;d.className='thumb';d.style.left=position(t)+'px';d.style.backgroundImage=`url(${images[Math.floor(i/100)].src})`;d.style.backgroundSize=`${index.width*10*scale}px ${index.height*10*scale}px`;d.style.backgroundPosition=`${-(i%10*index.width+c.x)*scale+(56-c.width*scale)/2}px ${-(Math.floor(i%100/10)*index.height+c.y)*scale}px`;track.append(d)}}else{const d=document.createElement('div');d.className='ruler';d.style.left=rail.clientWidth/2+'px';d.style.width=duration*28+'px';track.append(d)}dots();follow()}
function buttons(){$('#imagesMode').setAttribute('aria-pressed',String(variant==='images'));$('#videoMode').setAttribute('aria-pressed',String(variant==='video'));$('#imagesMode').disabled=!config.imagesReady;$('#videoMode').disabled=!videoReady;$('#speed').disabled=!videoReady;$('#speed').textContent=fast?'×1':'×30';$('#play').textContent=player.paused?'▶':'❚❚'}
function hidePreview(){canvas.style.display='none';search.style.display='none';player.style.display='block'}
function paintImage(t){const i=nearest(t),c=index.content;ctx.drawImage(images[Math.floor(i/100)],(i%10)*index.width+c.x,Math.floor(i%100/10)*index.height+c.y,c.width,c.height,0,0,canvas.width,canvas.height)}
function seekSearch(t,input){if(search.readyState<1||search.seeking){searchPending={time:t,input};return}const target=Math.min(t,search.duration-.02);searchRequest={time:target,input};if(Math.abs(search.currentTime-target)<.01){log('scrub_paint',{ms:performance.now()-input,time:target});return}search.currentTime=target}
search.addEventListener('loadeddata',()=>{videoReady=true;miniLoading=false;log('mini_ready',{ms:performance.now()-miniLoadAt});buttons();if(fallback)normal(current,!player.paused)});
search.addEventListener('error',()=>{miniLoading=false;log('mini_error')});
search.addEventListener('loadedmetadata',()=>{const p=searchPending;searchPending=null;if(p)seekSearch(p.time,p.input)});
search.addEventListener('seeked',()=>{const r=searchRequest;searchRequest=null;if(r&&scrubbing&&variant==='video'){log('mini_seek_ready',{ms:performance.now()-r.input,time:r.time});requestAnimationFrame(()=>requestAnimationFrame(()=>log('scrub_paint',{variant:'video',ms:performance.now()-r.input,time:r.time})))}if(searchPending){const p=searchPending;searchPending=null;seekSearch(p.time,p.input)}});
function preview(t,input){current=Math.max(0,Math.min(duration,t));clock();if(variant==='images'&&imagesReady){search.style.display='none';canvas.style.display='block';paintImage(current);const time=current;requestAnimationFrame(()=>requestAnimationFrame(()=>log('scrub_paint',{variant:'images',ms:performance.now()-input,time})))}else if(variant==='video'&&videoReady){canvas.style.display='none';search.style.display='block';seekSearch(current,input)}}
function quality(){const q=player.getVideoPlaybackQuality?.();if(q){log('fast_frames',{count:q.totalVideoFrames});log('fast_dropped',{count:q.droppedVideoFrames})}}
function scheduleFrame(){if(!player.requestVideoFrameCallback)return;frameId=player.requestVideoFrameCallback(onFrame)}
function onFrame(now,metadata){frameId=null;if(scrubbing)return;if(kind==='original')originalDecoded=true;const t=metadata.mediaTime*(kind==='fast'?30:1);if(waitingFrame&&!player.seeking&&Math.abs(t-seekTarget)<(fast?60:2)){waitingFrame=false;hidePreview();clearTimeout(watchdog);log('resume_frame',{ms:performance.now()-seekStarted,target:seekTarget,generation:seekGeneration});if(releaseAt)log('release_to_frame',{ms:performance.now()-releaseAt,target:seekTarget})}if(fast&&!player.paused){if(frameLast)log('fast_frame',{ms:now-frameLast,time:t});frameLast=now;current=t;clock();follow();scheduleFrame()}else if(waitingFrame&&!player.paused)scheduleFrame()}
function cancelFrame(){if(frameId!==null)player.cancelVideoFrameCallback?.(frameId);frameId=null;frameLast=0}
function armWatchdog(){clearTimeout(watchdog);if(originalDecoded)return;watchdog=setTimeout(()=>{if(kind!=='original'||scrubbing||player.paused||originalDecoded)return;if(player.readyState>=2)useFallback();else{log('original_buffering');armWatchdog()}},15000)}
function loadSource(next,t,play){
 cancelFrame();clearTimeout(watchdog);search.pause();waitingFrame=true;seekStarted=performance.now();seekTarget=t;seekGeneration++;pendingTime=t/(next==='fast'?30:1);
 const changed=next!==kind||!player.getAttribute('src');kind=next;player.muted=next!=='original';
 log('seek_request',{target:t,generation:seekGeneration});
 if(changed){player.src=next==='original'?'/api/timeline/play':next==='fast'?'/api/timeline/data/video/fast.mp4':'/api/timeline/data/video/search.mp4';log(next==='original'?'original_load_request':'mini_load_request')}
 else if(player.readyState>=1){player.currentTime=pendingTime;pendingTime=null}
 if(play)player.play().catch(()=>log('play_rejected'));buttons();
 if(next==='original'&&play)armWatchdog();
}
function normal(t,play=true){if(fast)quality();fast=false;loadSource(fallback&&videoReady?'mini':'original',t,play);buttons()}
function useFallback(){if(fallback)return;fallback=true;log('hevc_fallback');if(videoReady){fast=false;loadSource('mini',current,true)}buttons()}
player.addEventListener('loadedmetadata',()=>{if(pendingTime!==null){player.currentTime=Math.min(pendingTime,Math.max(0,player.duration-.02));pendingTime=null}log('media_metadata')});
player.addEventListener('loadeddata',()=>{log(kind==='original'?'original_loadeddata':'mini_loadeddata');if(!scrubbing&&!waitingFrame)hidePreview()});
player.addEventListener('seeked',()=>{log('seeked',{ms:performance.now()-seekStarted,time:sourceTime()});cancelFrame();scheduleFrame();if(player.paused)requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!scrubbing&&!player.seeking){waitingFrame=false;hidePreview();log('paused_ready_estimate',{ms:performance.now()-seekStarted,target:seekTarget})}}))});
player.addEventListener('playing',()=>{cancelFrame();scheduleFrame();buttons()});player.addEventListener('pause',buttons);
player.addEventListener('error',()=>{log('media_error',{count:player.error?.code||0});if(kind==='original')useFallback()});
player.addEventListener('timeupdate',()=>{if(fast&&!scrubbing)dots();if(!scrubbing&&!fast&&!player.seeking){current=sourceTime();clock();follow();dots()}});
player.addEventListener('ended',()=>{if(fast)quality();buttons()});
function startDrag(){if(scrubbing)return;current=sourceTime()||current;scrubbing=true;player.pause();cancelFrame();clearTimeout(watchdog);releaseAt=0;lastInput=performance.now();preview(current,lastInput);log('drag_start',{time:current})}
function settle(){scrubbing=false;searchPending=null;normal(current,true);dots();log('drag_settled',{time:current})}
rail.addEventListener('pointerdown',()=>{++followToken;syncing=false;startDrag()});
rail.addEventListener('scroll',()=>{if(syncing)return;startDrag();lastInput=performance.now();preview(rail.scrollLeft/28,lastInput);clearTimeout(settleTimer);settleTimer=setTimeout(settle,180)},{passive:true});
for(const event of ['pointerup','pointercancel'])rail.addEventListener(event,()=>{releaseAt=performance.now();clearTimeout(settleTimer);settleTimer=setTimeout(settle,180)});
function jump(t){clearTimeout(settleTimer);scrubbing=true;player.pause();preview(t,performance.now());follow();releaseAt=performance.now();settle()}
$('#mark').onclick=()=>{if(!scrubbing)current=sourceTime();marks.push(current);marks.sort((a,b)=>a-b);localStorage.setItem('tl-marks-1',JSON.stringify(marks));dots();log('mark',{time:current,count:marks.length})};
$('#prev').onclick=()=>{const t=marks.filter(t=>t<current-.2).pop();if(t!==undefined)jump(t)};$('#next').onclick=()=>{const t=marks.find(t=>t>current+.2);if(t!==undefined)jump(t)};
$('#play').onclick=()=>{if(player.paused){player.play().catch(()=>log('play_rejected'));if(kind==='original')armWatchdog()}else{if(fast)quality();player.pause()}buttons()};
$('#speed').onclick=()=>{const t=scrubbing?current:sourceTime();clearTimeout(settleTimer);scrubbing=false;hidePreview();releaseAt=0;if(fast)normal(t,true);else{fast=true;loadSource('fast',t,true);log('fast_start',{time:t})}buttons()};
for(const [id,value]of[['imagesMode','images'],['videoMode','video']])$('#'+id).onclick=()=>{variant=value;localStorage.setItem('tl-variant',value);buttons();renderTrack();if(value==='images'&&!imagesReady)refreshAssets();if(scrubbing)preview(current,performance.now());log('variant_selected')};
addEventListener('resize',()=>{renderTrack();log('resize',{width:innerWidth,height:innerHeight})});
async function refreshAssets(){
 try{config=await(await fetch('/api/timeline/config')).json();duration=config.duration||duration;
 if(config.imagesReady&&!imagesReady&&!imagesLoading&&variant==='images'){imagesLoading=true;const begin=performance.now();index=await(await fetch('/api/timeline/data/'+config.imagesRoot+'index.json')).json();if(!index.content){let{width:w,height:h,rotation}=index.source;if(Math.abs(rotation[0]||0)%180===90)[w,h]=[h,w];const scale=160/Math.max(w,h),cw=Math.round(w*scale/2)*2,ch=Math.round(h*scale/2)*2;index.content={x:(160-cw)/2,y:(160-ch)/2,width:cw,height:ch}}canvas.width=index.content.width;canvas.height=index.content.height;await Promise.all(Array.from({length:Math.ceil(index.times.length/100)},async(_,i)=>{const im=new Image();im.src=`/api/timeline/data/${config.imagesRoot}sheet-${String(i+1).padStart(3,'0')}.jpg`;await im.decode();images[i]=im}));imagesReady=true;log('atlas_ready',{ms:performance.now()-begin,count:images.length,width:index.content.width,height:index.content.height});renderTrack()}
 if(config.videoReady&&!videoReady&&!miniLoading){miniLoading=true;miniLoadAt=performance.now();search.src='/api/timeline/data/video/search.mp4';search.muted=true;log('mini_available')}buttons();
 }catch{imagesLoading=false;log('assets_not_ready')}
}
renderTrack();buttons();loadSource('original',0,false);refreshAssets();setInterval(refreshAssets,5000);requestAnimationFrame(()=>requestAnimationFrame(()=>log('page_ready',{width:innerWidth,height:innerHeight})));
window.timelineMetrics={run,flush,debug:()=>({variant,current,fast,fallback,kind,scrubbing,imagesReady,videoReady,time:sourceTime()})};
</script></html>
