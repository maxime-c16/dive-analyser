<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><title>Timeline</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080a0d;color:white;font-family:system-ui;height:100%;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;object-fit:contain}video{display:none}#primary{display:block}.bar{padding:12px 16px;display:grid;grid-template-columns:48px 48px minmax(0,1fr) 48px;align-items:center;gap:8px}button{border:0;background:#252b32;color:white;border-radius:24px;min-height:48px;min-width:0;font-size:20px;touch-action:manipulation}button:disabled{opacity:.35}#mark{background:#d4fd66;color:#111;font-weight:750;padding:0 14px;font-size:21px}#clock{position:absolute;z-index:3;top:12px;left:16px;padding:5px 9px;border-radius:8px;background:#080a0d88;font-variant-numeric:tabular-nums;font-size:16px}.modes{position:absolute;z-index:3;right:12px;top:12px;display:flex;padding:3px;border-radius:24px;background:#080a0dbb;gap:2px}.modes button{font-size:12px;min-height:30px;padding:0 12px;background:transparent}.modes button[aria-pressed=true]{background:#eee;color:#111}#speed{position:absolute;z-index:3;right:16px;bottom:12px;font-size:14px;min-height:40px;padding:0 18px;background:#252b32dd}#railbox{position:relative;height:94px;margin-bottom:12px}#railbox:after{content:'';position:absolute;left:50%;top:0;height:90px;width:2px;background:#d4fd66;pointer-events:none}#rail{height:94px;overflow-x:scroll;overflow-y:hidden;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}#track{position:relative;height:82px;margin-top:4px}.thumb{position:absolute;top:0;width:56px;height:80px;background-repeat:no-repeat}.dot{position:absolute;top:0;width:5px;height:82px;background:#d4fd66;z-index:2}.ruler{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff30 0 1px,transparent 1px 28px);height:18px;top:30px}#error{position:absolute;inset:0;display:none;place-items:center;background:#080a0d;padding:24px}@media(orientation:landscape){.bar{padding:5px 24px}#railbox{height:70px;margin-bottom:0}.thumb{height:56px}#rail{height:70px}#railbox:after{height:64px}}
main[data-mode="images"] #play,main[data-mode="images"] #speed{display:none}main[data-mode="images"] .bar{grid-template-columns:48px minmax(0,1fr) 48px}</style><main><div class="stage"><video id="primary" playsinline preload="auto"></video><video id="search" playsinline muted preload="auto"></video><canvas style="display:none"></canvas><span id="clock">0:00</span><div class="modes"><button id="imagesMode" aria-pressed="true" disabled>Images</button><button id="videoMode" aria-pressed="false" disabled>Vidéo</button></div><button id="speed" disabled>×30</button><div id="error"></div></div><div class="bar"><button id="play" aria-label="Lecture">▶</button><button id="prev" aria-label="Marque précédente">◀</button><button id="mark">Plongeon</button><button id="next" aria-label="Marque suivante">▶</button></div><div id="railbox"><div id="rail" aria-label="Timeline" tabindex="0"><div id="track"></div></div></div></main>
<script type="module">
const $=s=>document.querySelector(s),player=$('#primary'),fastPlayer=$('#search'),canvas=$('canvas'),ctx=canvas.getContext('2d'),rail=$('#rail'),track=$('#track');
const params=new URLSearchParams(location.search),run=(params.get('test')==='webkit'?'webkit-':'')+(crypto.randomUUID?.()||`${Date.now()}-${Math.random()}`),build='iphone-modes-v3';
const state={mode:'images',fast:false,revision:0};
let duration=1936.801667,index=null,images=[],imagesReady=false,imagesLoading=false,videoReady=false,config={},marks=[],current=0,touching=false,scrubbing=false,syncing=false,followToken=0,settleTimer,lastInput=0,releaseAt=0,releaseOrigin=0,seekStarted=0,seekTarget=0,generation=0,waitingFrame=false,frameId=null,fastFrameId=null,fastLast=0,queue=[],originalAttached=false,wantPlay=false,fallback=false,pendingOriginal=null,pendingFast=null,lastWarm=0,lastWarmTarget=0,warmTimer=null,warmTarget=null,lastTouch=new WeakMap();
try{marks=JSON.parse(localStorage.getItem('tl-marks-1')||'[]').filter(Number.isFinite)}catch{}
function log(event,values={}){queue.push({build,elapsed:performance.now(),event,variant:state.mode,speed:state.fast?30:1,ms:performance.now(),revision:state.revision,...values});if(queue.length>1000)queue.splice(0,queue.length-1000);if(queue.length>=40)flush()}
function flush(){if(!queue.length)return;const events=queue.splice(0,100);fetch('/api/timeline/metrics',{method:'POST',body:JSON.stringify({run,ua:navigator.userAgent,events}),keepalive:true}).catch(()=>{queue.unshift(...events);queue=queue.slice(-1000)})}
setInterval(flush,2000);addEventListener('pagehide',()=>navigator.sendBeacon('/api/timeline/metrics',JSON.stringify({run,ua:navigator.userAgent,events:queue.splice(0,100)})));
function sourceTime(){if(state.mode==='images'||scrubbing)return current;return Math.min(duration,state.fast?(pendingFast!==null?pendingFast*30:fastPlayer.currentTime*30):(pendingOriginal!==null||player.seeking)?seekTarget:player.currentTime)}
function clock(){$('#clock').textContent=`${Math.floor(current/60)}:${String(Math.floor(current%60)).padStart(2,'0')}`}
function position(t){return t*28+rail.clientWidth/2}
function follow(){const token=++followToken;syncing=true;rail.scrollLeft=current*28;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token===followToken)syncing=false}))}
function nearest(t){let lo=0,hi=index.times.length-1;while(lo<hi){const m=Math.ceil((lo+hi)/2);if(index.times[m]<=t)lo=m;else hi=m-1}return lo}
function dots(){track.querySelectorAll('.dot').forEach(e=>e.remove());for(const t of marks){const d=document.createElement('i');d.className='dot';d.style.left=position(t)+'px';track.append(d)}$('#prev').disabled=!marks.some(t=>t<current-.2);$('#next').disabled=!marks.some(t=>t>current+.2)}
function paintImage(t){const i=nearest(t),c=index.content;ctx.drawImage(images[Math.floor(i/100)],(i%10)*index.width+c.x,Math.floor(i%100/10)*index.height+c.y,c.width,c.height,0,0,canvas.width,canvas.height)}
function preview(t,input=performance.now(),measure=false){current=Math.max(0,Math.min(duration,t));clock();canvas.style.display='block';if(imagesReady){paintImage(current);const time=current;if(measure)requestAnimationFrame(()=>requestAnimationFrame(()=>log('scrub_paint',{ms:performance.now()-input,time})))}}
function renderTrack(){track.replaceChildren();track.style.width=duration*28+rail.clientWidth+'px';if(imagesReady){for(let t=0;t<duration;t+=2){const i=nearest(t),d=document.createElement('div'),c=index.content,scale=80/c.height;d.className='thumb';d.style.left=position(t)+'px';d.style.backgroundImage=`url(${images[Math.floor(i/100)].src})`;d.style.backgroundSize=`${index.width*10*scale}px ${index.height*10*scale}px`;d.style.backgroundPosition=`${-(i%10*index.width+c.x)*scale+(56-c.width*scale)/2}px ${-(Math.floor(i%100/10)*index.height+c.y)*scale}px`;track.append(d)}}else{const d=document.createElement('div');d.className='ruler';d.style.left=rail.clientWidth/2+'px';d.style.width=duration*28+'px';track.append(d)}dots();follow()}
function buttons(){$('main').dataset.mode=state.mode;$('#imagesMode').disabled=false;$('#videoMode').disabled=false;$('#imagesMode').setAttribute('aria-pressed',String(state.mode==='images'));$('#videoMode').setAttribute('aria-pressed',String(state.mode==='video'));$('#speed').disabled=!videoReady;$('#speed').textContent=state.fast?'×1':'×30';$('#play').textContent=(state.fast?fastPlayer:player).paused?'▶':'❚❚'}
function stateProof(requested){requestAnimationFrame(()=>requestAnimationFrame(()=>log('control_state',{requested,applied:state.mode,status:$('#videoMode').getAttribute('aria-pressed')===String(state.mode==='video')&&$('#speed').textContent===(state.fast?'×1':'×30')?'ok':'mismatch',count:state.fast?30:1})))}
function activate(id,action){const element=$('#'+id);element.addEventListener('touchend',e=>{if(element.disabled)return;e.preventDefault();lastTouch.set(element,performance.now());log('control_input',{input:'touchend',requested:id,trusted:e.isTrusted});action();stateProof(id)},{passive:false});element.addEventListener('click',e=>{if(performance.now()-(lastTouch.get(element)||-1000)<700){log('control_duplicate_ignored',{requested:id});return}log('control_input',{input:'click',requested:id,trusted:e.isTrusted});action();stateProof(id)})}
function cancelMainFrame(){if(frameId!==null)player.cancelVideoFrameCallback?.(frameId);frameId=null}
function armMainFrame(){cancelMainFrame();if(!player.requestVideoFrameCallback){log('frame_callback_unavailable');return}const ticket=generation;frameId=player.requestVideoFrameCallback((now,metadata)=>{frameId=null;if(ticket!==generation||state.mode!=='video'||state.fast||scrubbing)return;const delta=metadata.mediaTime-seekTarget;if(waitingFrame&&!player.seeking&&Math.abs(delta)<2){waitingFrame=false;canvas.style.display='none';player.style.display='block';log('resume_frame',{ms:performance.now()-seekStarted,target:seekTarget,mediaTime:metadata.mediaTime,delta,generation});if(releaseAt)log('release_to_frame',{ms:performance.now()-releaseAt,target:seekTarget,mediaTime:metadata.mediaTime,delta,inertia_ms:Math.max(0,seekStarted-releaseAt)});if(lastInput)log('scroll_end_to_frame',{ms:performance.now()-lastInput,target:seekTarget})}else if(waitingFrame&&!player.paused)armMainFrame()})}
function playOriginal(){wantPlay=true;player.playbackRate=1;player.muted=fallback;const promise=player.play();promise?.then(()=>log('play_accepted')).catch(e=>log('play_rejected',{error:e.name}));buttons()}
function ensureOriginal(){if(originalAttached)return;originalAttached=true;player.preload='auto';player.muted=false;player.src='/api/timeline/play';log('original_load_request')}
function seekElement(t,reason){const bounded=Math.min(duration-.05,Math.max(0,t)),method=typeof player.fastSeek==='function'?'fastSeek':'currentTime';if(method==='fastSeek')player.fastSeek(bounded);else player.currentTime=bounded;log(reason,{target:bounded,method,ready:player.readyState,buffered:player.buffered.length,seekable:player.seekable.length})}
function resume(t,fromRelease=false){clearTimeout(warmTimer);warmTarget=null;state.fast=false;fastPlayer.pause();fastPlayer.style.display='none';player.style.display='block';generation++;cancelMainFrame();seekTarget=t;seekStarted=performance.now();waitingFrame=true;if(!fromRelease){releaseAt=0;lastInput=0}preview(t);ensureOriginal();if(player.readyState>=1){pendingOriginal=null;if(Math.abs(player.currentTime-t)>.65||player.seeking)seekElement(t,'release_seek');else log('warm_hit',{target:t,mediaTime:player.currentTime});}else pendingOriginal=t;playOriginal();armMainFrame();buttons();log('seek_request',{target:t,generation})}
function warmPlay(){if(state.mode!=='video'||state.fast||!scrubbing)return;player.muted=true;player.playbackRate=.25;player.play()?.then(()=>log('warm_play_accepted')).catch(e=>log('warm_play_rejected',{error:e.name}))}
function warmSeek(){warmTimer=null;if(state.mode!=='video'||!scrubbing||state.fast||warmTarget===null||player.readyState<1)return;if(player.seeking||performance.now()-lastWarm<650){warmTimer=setTimeout(warmSeek,150);return}const t=warmTarget;warmTarget=null;if(Math.abs(player.currentTime-t)<.9)return;lastWarm=performance.now();lastWarmTarget=t;seekElement(t,'warm_seek')}
function queueWarm(t){if(state.mode!=='video'||state.fast||!originalAttached)return;warmTarget=t;if(!warmTimer)warmTimer=setTimeout(warmSeek,0)}
player.addEventListener('loadedmetadata',()=>{log('original_metadata');if(state.mode==='video'&&pendingOriginal!==null){const t=pendingOriginal;pendingOriginal=null;seekElement(t,'metadata_seek')}});
player.addEventListener('loadeddata',()=>log('original_loadeddata'));
player.addEventListener('seeked',()=>{if(wantPlay&&state.mode==='video'&&!scrubbing&&!state.fast&&player.paused)playOriginal();log(scrubbing?'warm_seeked':'seeked',{ms:performance.now()-(scrubbing?lastWarm:seekStarted),mediaTime:player.currentTime,target:scrubbing?lastWarmTarget:seekTarget});if(scrubbing){warmPlay();if(warmTarget!==null&&!warmTimer)warmTimer=setTimeout(warmSeek,150)}else armMainFrame()});
player.addEventListener('playing',()=>{if(state.mode!=='video'||state.fast){player.pause();return}armMainFrame();buttons()});player.addEventListener('pause',buttons);
player.addEventListener('timeupdate',()=>{if(state.mode==='video'&&!state.fast&&!scrubbing&&!waitingFrame&&!player.seeking){current=Math.min(duration,player.currentTime);clock();follow();dots()}});
player.addEventListener('error',()=>{log('original_error',{count:player.error?.code||0});if(!fallback&&config.videoReady){fallback=true;player.src='/api/timeline/data/video/search.mp4';player.muted=true;pendingOriginal=current;log('hevc_fallback');if(state.mode==='video')playOriginal()}});
function fastQuality(){const q=fastPlayer.getVideoPlaybackQuality?.();if(q){log('fast_frames',{count:q.totalVideoFrames});log('fast_dropped',{count:q.droppedVideoFrames})}}
function fastFrames(){if(!fastPlayer.requestVideoFrameCallback)return;fastFrameId=fastPlayer.requestVideoFrameCallback((now,meta)=>{if(!state.fast||state.mode!=='video')return;if(fastLast)log('fast_frame',{ms:now-fastLast,time:meta.mediaTime*30});fastLast=now;current=Math.min(duration,meta.mediaTime*30);clock();follow();if(fastPlayer.readyState>=2)canvas.style.display='none';if(!fastPlayer.paused)fastFrames()})}
fastPlayer.addEventListener('loadedmetadata',()=>{log('fast_metadata');if(pendingFast!==null){fastPlayer.currentTime=Math.min(pendingFast,fastPlayer.duration-.02);pendingFast=null}});
fastPlayer.addEventListener('loadeddata',()=>log('fast_loadeddata'));
fastPlayer.addEventListener('playing',()=>{if(!state.fast||state.mode!=='video'){fastPlayer.pause();return}fastLast=0;fastFrames();buttons();log('fast_playing')});
fastPlayer.addEventListener('error',()=>log('fast_error',{count:fastPlayer.error?.code||0}));
function toggleFast(){log('speed_requested',{count:state.fast?1:30});const t=sourceTime();clearTimeout(settleTimer);scrubbing=false;touching=false;state.revision++;if(state.fast){fastQuality();preview(t);resume(t);log('speed_applied',{count:1});return}state.fast=true;current=t;player.pause();cancelMainFrame();waitingFrame=false;releaseAt=0;preview(t);fastPlayer.muted=true;fastPlayer.style.display='block';pendingFast=t/30;if(!fastPlayer.getAttribute('src'))fastPlayer.src='/api/timeline/data/video/fast.mp4';if(fastPlayer.readyState>=1){fastPlayer.currentTime=Math.min(pendingFast,fastPlayer.duration-.02);pendingFast=null}fastPlayer.play()?.then(()=>log('fast_play_accepted')).catch(e=>log('fast_play_rejected',{error:e.name}));buttons();log('speed_applied',{count:30})}
function setMode(mode){const before=state.mode,t=sourceTime();clearTimeout(settleTimer);clearTimeout(warmTimer);warmTarget=null;touching=false;scrubbing=false;current=t;state.mode=mode;state.revision++;localStorage.setItem('tl-mode-v3',mode);if(mode==='images'){if(state.fast)fastQuality();state.fast=false;wantPlay=false;generation++;waitingFrame=false;cancelMainFrame();player.pause();fastPlayer.pause();fastPlayer.style.display='none';player.style.display='none';preview(t);buttons()}else{state.fast=false;resume(t)}log('mode_applied',{requested:mode,applied:state.mode,before});buttons();stateProof(mode)}
function startDrag(){if(scrubbing)return;current=sourceTime();scrubbing=true;wantPlay=false;if(state.mode==='video'&&!state.fast){warmPlay()}else player.pause();fastPlayer.pause();cancelMainFrame();waitingFrame=false;releaseAt=0;lastInput=performance.now();preview(current,lastInput,true);log('drag_start',{time:current})}
function settle(){if(touching)return;scrubbing=false;if(state.mode==='video')resume(current,true);else{state.fast=false;player.pause();fastPlayer.pause();buttons()}dots();log('drag_settled',{time:current})}
rail.addEventListener('pointerdown',()=>{++followToken;syncing=false;startDrag()});
rail.addEventListener('scroll',()=>{if(syncing)return;startDrag();lastInput=performance.now();preview(rail.scrollLeft/28,lastInput,true);queueWarm(current);clearTimeout(settleTimer);settleTimer=setTimeout(settle,100)},{passive:true});
rail.addEventListener('touchstart',()=>{touching=true;++followToken;syncing=false;startDrag()},{passive:true});
rail.addEventListener('touchend',()=>{touching=false;releaseAt=performance.now();log('release',{time:current});clearTimeout(settleTimer);settleTimer=setTimeout(settle,100)},{passive:true});
rail.addEventListener('touchcancel',()=>{touching=false;releaseAt=0;log('touch_cancel');clearTimeout(settleTimer);settleTimer=setTimeout(settle,100)},{passive:true});
rail.addEventListener('pointerup',e=>{if(e.pointerType==='touch')return;releaseAt=performance.now();clearTimeout(settleTimer);settleTimer=setTimeout(settle,100)});
function jump(t){clearTimeout(settleTimer);scrubbing=false;current=t;preview(t);follow();dots();if(state.mode==='video')resume(t);log('mark_jump',{time:t})}
activate('imagesMode',()=>setMode('images'));activate('videoMode',()=>setMode('video'));activate('speed',toggleFast);
activate('mark',()=>{if(state.mode==='video'&&!scrubbing)current=sourceTime();marks.push(current);marks.sort((a,b)=>a-b);localStorage.setItem('tl-marks-1',JSON.stringify(marks));dots();log('mark',{time:current,count:marks.length})});
activate('prev',()=>{const t=marks.filter(t=>t<current-.2).pop();if(t!==undefined)jump(t)});activate('next',()=>{const t=marks.find(t=>t>current+.2);if(t!==undefined)jump(t)});
activate('play',()=>{const video=state.fast?fastPlayer:player;if(video.paused){if(state.fast)video.play()?.catch(e=>log('fast_play_rejected',{error:e.name}));else playOriginal()}else{wantPlay=false;video.pause();if(state.fast)fastQuality()}buttons()});
addEventListener('resize',()=>{renderTrack();log('resize',{width:innerWidth,height:innerHeight})});
async function refreshAssets(){try{config=await(await fetch('/api/timeline/config')).json();duration=config.duration||duration;videoReady=Boolean(config.videoReady);if(config.imagesReady&&!imagesReady&&!imagesLoading){imagesLoading=true;const begin=performance.now();index=await(await fetch('/api/timeline/data/'+config.imagesRoot+'index.json')).json();canvas.width=index.content.width;canvas.height=index.content.height;await Promise.all(Array.from({length:Math.ceil(index.times.length/100)},async(_,i)=>{const im=new Image();im.src=`/api/timeline/data/${config.imagesRoot}sheet-${String(i+1).padStart(3,'0')}.jpg`;await im.decode();images[i]=im}));imagesReady=true;log('atlas_ready',{ms:performance.now()-begin,count:images.length});renderTrack();if(state.mode==='images'||scrubbing)preview(current)}buttons();log('assets_state',{count:videoReady?1:0})}catch{imagesLoading=false;log('assets_not_ready')}}
player.style.display='none';fastPlayer.style.display='none';renderTrack();buttons();refreshAssets();setInterval(refreshAssets,5000);requestAnimationFrame(()=>requestAnimationFrame(()=>log('page_ready',{width:innerWidth,height:innerHeight})));
window.timelineMetrics={run,build,flush,debug:()=>({mode:state.mode,variant:state.mode,fast:state.fast,revision:state.revision,current,time:sourceTime(),scrubbing,imagesReady,videoReady,fallback,originalAttached,waitingFrame})};
</script></html>
