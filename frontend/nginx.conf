server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server level; repeated where a location defines
    # its own add_header because nginx does not inherit then).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Exact-match manifest route: the base image's mime.types has no
    # .webmanifest mapping and nosniff is set, so default it to the manifest
    # content type here. (A server-level `types {}` block would *replace*
    # all inherited MIME mappings; default_type in one exact location is
    # surgical and leaves .js/.css/etc. untouched.)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
