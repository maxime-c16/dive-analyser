server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (server level; repeated where a location defines
    # its own add_header because nginx does not inherit then).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The base image's mime.types has no .webmanifest mapping, and the
    # nosniff header below forbids sniffing: without this, the manifest is
    # served as application/octet-stream and browsers may refuse to parse
    # it, silently disabling the home-screen scope fix.
    types {
        application/manifest+json webmanifest;
    }

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
