services:
  # PostgreSQL Database (lightweight alpine image)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diving_analyzer_db}
      POSTGRES_USER: ${POSTGRES_USER:-diving}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_USE_RUNTIME_ENV}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diving} -d ${POSTGRES_DB:-diving_analyzer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits - conservative
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6002:8000"
    volumes:
      - ./backend:/app
      - ./src:/app/legacy_scripts:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./media/videos:/videos:ro
      - ./media/cache:/app/media-cache
      - ./media/analysis-artifacts:/app/analysis-artifacts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diving}:${POSTGRES_PASSWORD:-CHANGE_ME_USE_RUNTIME_ENV}@postgres:5432/${POSTGRES_DB:-diving_analyzer_db}
      PYTHONUNBUFFERED: 1
      LEGACY_MODE: "true"
      MEDIA_CACHE_ROOT: /app/media-cache
      ANALYSIS_ARTIFACT_ROOT: /app/analysis-artifacts
      API_TITLE: Diving Analytics API
      API_VERSION: 1.0.0
      PRIMARY_DIVER_NAME: ${PRIMARY_DIVER_NAME:-Maxime}
      DIVE_ANALYSIS_CACHE_TTL_SECONDS: ${DIVE_ANALYSIS_CACHE_TTL_SECONDS:-60}
      ANALYTICS_CACHE_TTL_SECONDS: "${ANALYTICS_CACHE_TTL_SECONDS:-60}"
      PERSONAL_DIVE_VALUE_ENABLED: "${PERSONAL_DIVE_VALUE_ENABLED:-true}"
      PERSONAL_DIVE_VALUE_CACHE_TTL_SECONDS: "${PERSONAL_DIVE_VALUE_CACHE_TTL_SECONDS:-120}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-2}"
      SLOW_QUERY_LOG_MS: "${SLOW_QUERY_LOG_MS:-250}"
      SLOW_REQUEST_LOG_MS: "${SLOW_REQUEST_LOG_MS:-500}"
      AUTO_IMPORT: "true"
      NEW_VIDEO_AUTO_MEDIA_ENABLED: "${NEW_VIDEO_AUTO_MEDIA_ENABLED:-false}"
      MAC_AGENT_API_KEYS: ${MAC_AGENT_API_KEYS:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://192.168.1.57:6090,http://deb-serv:6090,http://localhost:6090,https://192.168.1.57:6443,https://deb-serv:6443}
      # P5 user auth + B2 playback canary (feature flags default OFF/fail-closed)
      USER_AUTH_ENABLED: "${USER_AUTH_ENABLED:-false}"
      B2_PLAYBACK_CANARY_ENABLED: "${B2_PLAYBACK_CANARY_ENABLED:-false}"
      # Friend access: invite-gated self-registration (fail-closed both ways)
      FRIEND_REGISTRATION_ENABLED: "${FRIEND_REGISTRATION_ENABLED:-false}"
      FRIEND_INVITE_CODES: ${FRIEND_INVITE_CODES:-}
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-da_session}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-604800}"
      AUTH_LOGIN_MAX_FAILURES: "${AUTH_LOGIN_MAX_FAILURES:-20}"
      AUTH_LOGIN_IP_MAX_FAILURES: "${AUTH_LOGIN_IP_MAX_FAILURES:-10}"
      AUTH_LOGIN_FAILURE_WINDOW_SECONDS: "${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}"
      AUTH_SESSION_CLEANUP_RETENTION_SECONDS: "${AUTH_SESSION_CLEANUP_RETENTION_SECONDS:-86400}"
      MEDIA_PLAYBACK_PRESIGN_TTL_SECONDS: "${MEDIA_PLAYBACK_PRESIGN_TTL_SECONDS:-120}"
      B2_PLAYBACK_REGION: ${B2_PLAYBACK_REGION:-}
      B2_PLAYBACK_ENDPOINT_URL: ${B2_PLAYBACK_ENDPOINT_URL:-}
      B2_PLAYBACK_KEY_ID: ${B2_PLAYBACK_KEY_ID:-}
      B2_PLAYBACK_KEY_SECRET: ${B2_PLAYBACK_KEY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # React Frontend
  frontend:
    image: dive-analyser-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6001:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Adminer for database admin (lightweight)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "6090:80"
      - "6443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - adminer
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: diving_network
    driver: bridge
