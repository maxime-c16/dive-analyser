services:
  # PostgreSQL Database (lightweight alpine image)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diving_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-diver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diving_secure_2024}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diver"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits - conservative
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "6002:8000"
    volumes:
      - ./backend:/app
      - ./src:/app/legacy_scripts:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./media/videos:/videos:ro
      - "/Users/mcauchy/Pictures/Photos Library.photoslibrary:/photos_library"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diver}:${POSTGRES_PASSWORD:-diving_secure_2024}@postgres:5432/${POSTGRES_DB:-diving_analytics}
      PYTHONUNBUFFERED: 1
      LEGACY_MODE: "true"
      PHOTOS_LIBRARY_PATH: /photos_library
      API_TITLE: Diving Analytics API
      API_VERSION: 1.0.0
      AUTO_IMPORT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "6001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: /api
      VITE_WS_URL: /api/v1/ws
      PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    command: npm run dev
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Adminer for database admin (lightweight)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "6090:80"
      - "6443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
      - adminer
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: diving_network
    driver: bridge
