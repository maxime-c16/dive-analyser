services:
  # PostgreSQL Database (lightweight alpine image)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diving_analyzer_db}
      POSTGRES_USER: ${POSTGRES_USER:-diving}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_USE_RUNTIME_ENV}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diving} -d ${POSTGRES_DB:-diving_analyzer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits - conservative
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # FastAPI Backend
  backend:
    # The host's Google resolver times out from this bridge network, causing
    # original playback HEAD checks to fail before a storage redirect. Docker
    # keeps internal service discovery; use reachable upstreams for B2/SMTP.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6002:8000"
    volumes:
      - ./backend:/app
      - ./src:/app/legacy_scripts:ro
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./media/videos:/videos:ro
      - ./media/cache:/app/media-cache
      - ./media/analysis-artifacts:/app/analysis-artifacts
      # Club source documents must never share the nginx-served media volume.
      - ${HOME}/.local/share/diveanalyzer/calendar-private:/app/calendar-private
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diving}:${POSTGRES_PASSWORD:-CHANGE_ME_USE_RUNTIME_ENV}@postgres:5432/${POSTGRES_DB:-diving_analyzer_db}
      PYTHONUNBUFFERED: 1
      LEGACY_MODE: "true"
      MEDIA_CACHE_ROOT: /app/media-cache
      # Rollback knob for nginx byte-serving; default on. Requires the
      # matching /internal-media-cache/ location and cache-root mount below.
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      MEDIA_SIGNED_URLS_ENABLED: ${MEDIA_SIGNED_URLS_ENABLED:-false}
      MEDIA_XACCEL_ENABLED: ${MEDIA_XACCEL_ENABLED:-true}
      ANALYSIS_ARTIFACT_ROOT: /app/analysis-artifacts
      API_TITLE: Diving Analytics API
      API_VERSION: 1.0.0
      PRIMARY_DIVER_NAME: ${PRIMARY_DIVER_NAME:-Maxime}
      DIVE_ANALYSIS_CACHE_TTL_SECONDS: ${DIVE_ANALYSIS_CACHE_TTL_SECONDS:-60}
      ANALYTICS_CACHE_TTL_SECONDS: "${ANALYTICS_CACHE_TTL_SECONDS:-60}"
      PERSONAL_DIVE_VALUE_ENABLED: "${PERSONAL_DIVE_VALUE_ENABLED:-true}"
      PERSONAL_DIVE_VALUE_CACHE_TTL_SECONDS: "${PERSONAL_DIVE_VALUE_CACHE_TTL_SECONDS:-120}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-2}"
      SLOW_QUERY_LOG_MS: "${SLOW_QUERY_LOG_MS:-250}"
      SLOW_REQUEST_LOG_MS: "${SLOW_REQUEST_LOG_MS:-500}"
      AUTO_IMPORT: "true"
      NEW_VIDEO_AUTO_MEDIA_ENABLED: "${NEW_VIDEO_AUTO_MEDIA_ENABLED:-false}"
      MAC_AGENT_API_KEYS: ${MAC_AGENT_API_KEYS:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://192.168.1.57:6090,http://deb-serv:6090,http://localhost:6090,https://192.168.1.57:6443,https://deb-serv:6443}
      # P5 user auth + B2 playback canary (feature flags default OFF/fail-closed)
      # Calendar pilot: keep off until migrations, source review and worker gate.
      CALENDAR_ENABLED: "${CALENDAR_ENABLED:-false}"
      USER_AUTH_ENABLED: "${USER_AUTH_ENABLED:-false}"
      B2_PLAYBACK_CANARY_ENABLED: "${B2_PLAYBACK_CANARY_ENABLED:-false}"
      # Friend access: invite-gated self-registration (fail-closed both ways)
      FRIEND_REGISTRATION_ENABLED: "${FRIEND_REGISTRATION_ENABLED:-false}"
      FRIEND_INVITE_CODES: ${FRIEND_INVITE_CODES:-}
      AUTH_COOKIE_NAME: "${AUTH_COOKIE_NAME:-da_session}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-604800}"
      AUTH_LOGIN_MAX_FAILURES: "${AUTH_LOGIN_MAX_FAILURES:-20}"
      AUTH_LOGIN_IP_MAX_FAILURES: "${AUTH_LOGIN_IP_MAX_FAILURES:-10}"
      AUTH_LOGIN_FAILURE_WINDOW_SECONDS: "${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}"
      AUTH_SESSION_CLEANUP_RETENTION_SECONDS: "${AUTH_SESSION_CLEANUP_RETENTION_SECONDS:-86400}"
      MEDIA_PLAYBACK_PRESIGN_TTL_SECONDS: "${MEDIA_PLAYBACK_PRESIGN_TTL_SECONDS:-120}"
      MEDIA_PLAYBACK_HEAD_CACHE_SECONDS: "${MEDIA_PLAYBACK_HEAD_CACHE_SECONDS:-300}"
      MEDIA_JOBS_B2_SOURCE_ENABLED: "${MEDIA_JOBS_B2_SOURCE_ENABLED:-true}"
      # D2 lease fencing sunset switch (default off = bounded drain). Runtime
      # value comes from ~/.config/diveanalyzer/media-jobs.env on deb-serv
      # (sourced by ci/ship.sh), never from Git. Same-SHA activation needs
      # --force (ship.sh skips identical SHAs otherwise).
      MEDIA_JOBS_REQUIRE_LEASE_TOKEN: "${MEDIA_JOBS_REQUIRE_LEASE_TOKEN:-false}"
      # D3b2 fenced web packages (hq/light/poster single pass). Default OFF:
      # no package job is queued or leased while false. Runtime value comes
      # from ~/.config/diveanalyzer/media-jobs.env on deb-serv (sourced by
      # ci/ship.sh), never from Git. Same-SHA activation needs --force.
      MEDIA_WEB_PACKAGES_ENABLED: "${MEDIA_WEB_PACKAGES_ENABLED:-false}"
      # D3b2 broad automatic package ingestion (default OFF). Master flag on +
      # auto-ingest off admits ONLY explicitly queued canary jobs; broad
      # queueing needs both flags. Runtime values come from
      # ~/.config/diveanalyzer/media-jobs.env on deb-serv (sourced by
      # ci/ship.sh), never from Git. Same-SHA activation needs --force.
      MEDIA_WEB_PACKAGES_AUTO_INGEST_SINCE: "${MEDIA_WEB_PACKAGES_AUTO_INGEST_SINCE:-}"
      MEDIA_WEB_PACKAGES_AUTO_INGEST_ENABLED: "${MEDIA_WEB_PACKAGES_AUTO_INGEST_ENABLED:-false}"
      B2_UPLOAD_KEY_ID: ${B2_UPLOAD_KEY_ID:-}
      B2_UPLOAD_KEY_SECRET: ${B2_UPLOAD_KEY_SECRET:-}
      B2_UPLOAD_REGION: ${B2_UPLOAD_REGION:-}
      B2_UPLOAD_ENDPOINT_URL: ${B2_UPLOAD_ENDPOINT_URL:-}
      B2_UPLOAD_ENVIRONMENT: ${B2_UPLOAD_ENVIRONMENT:-dev}
      B2_PLAYBACK_REGION: ${B2_PLAYBACK_REGION:-}
      B2_PLAYBACK_ENDPOINT_URL: ${B2_PLAYBACK_ENDPOINT_URL:-}
      B2_PLAYBACK_KEY_ID: ${B2_PLAYBACK_KEY_ID:-}
      B2_PLAYBACK_KEY_SECRET: ${B2_PLAYBACK_KEY_SECRET:-}
      # Web Push (VAPID) for notifications; empty = push gracefully disabled.
      # Runtime values live in ~/.config/diveanalyzer/browser-upload.env
      # on deb-serv (loaded by ci/ship.sh), never in Git.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Deposit batches ("Récupérer mes plongeons") + batch email (free Gmail
      # SMTP maintainer account). Runtime values live in
      # ~/.config/diveanalyzer/email.env on deb-serv (loaded by ci/ship.sh),
      # never in Git. Empty SMTP_HOST disables sending (outbox stays pending).
      INGEST_DEPOSITOR_EMAIL: ${INGEST_DEPOSITOR_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      BATCH_EMAIL_DELAY_MINUTES: ${BATCH_EMAIL_DELAY_MINUTES:-45}
      CLAIM_TOKEN_TTL_SECONDS: ${CLAIM_TOKEN_TTL_SECONDS:-604800}
      # Shared sessions (docs/features/SHARED_SESSIONS.md), default off.
      # Runtime values live in ~/.config/diveanalyzer/sessions.env on deb-serv
      # (loaded by ci/ship.sh), never in Git.
      SHARED_SESSIONS_ENABLED: "${SHARED_SESSIONS_ENABLED:-false}"
      SHARED_SESSIONS_OWNER_EMAIL: ${SHARED_SESSIONS_OWNER_EMAIL:-}
      SESSIONS_B2_BUCKET: ${SESSIONS_B2_BUCKET:-diveanalyzer-sessions}
      SESSIONS_B2_REGION: ${SESSIONS_B2_REGION:-eu-central-003}
      SESSIONS_B2_ENDPOINT_URL: ${SESSIONS_B2_ENDPOINT_URL:-}
      SESSIONS_B2_KEY_ID: ${SESSIONS_B2_KEY_ID:-}
      SESSIONS_B2_KEY_SECRET: ${SESSIONS_B2_KEY_SECRET:-}
      SESSIONS_B2_EVENT_SECRET: ${SESSIONS_B2_EVENT_SECRET:-}
      SESSIONS_TELEGRAM_BOT_TOKEN: ${SESSIONS_TELEGRAM_BOT_TOKEN:-}
      SESSIONS_TELEGRAM_CHAT_ID: ${SESSIONS_TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Single worker: the websocket manager and playback metrics are
    # process-local, so multi-worker deployment would split-brain sync
    # events per worker. Event-loop blocking work is offloaded instead.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # React Frontend
  frontend:
    image: dive-analyser-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6001:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Adminer for database admin (lightweight)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

  # Nginx reverse proxy
  nginx:
    image: nginx:1.29.4-alpine
    environment:
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      NGINX_ENVSUBST_FILTER: ^MEDIA_SIGNING_SECRET$
    restart: unless-stopped
    ports:
      - "6090:80"
      - "6443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/njs:/etc/nginx/njs:ro
      - ./nginx/media-signing.conf.template:/etc/nginx/templates/media-signing.conf.template:ro
      - ./nginx/signing-entrypoint.sh:/docker-entrypoint.d/19-media-signing.sh:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Byte-serving X-Accel-Redirect for cached media; the backend keeps
      # auth/path-verification, nginx streams the file itself.
      - ./media/cache:/app/media-cache:ro
    depends_on:
      - backend
      - frontend
      - adminer
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: diving_network
    driver: bridge
