[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diving-analyser-mac-agent"
version = "0.1.0"
description = "Auto-sync dive videos from macOS Photos library to Diving Analyser server"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Diving Analyser", email = "agent@diving-analyser.local"}
]
keywords = ["diving", "photos", "sync", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS 10.13 and later",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "osxphotos==0.76.1",
    "pyyaml==6.0.1",
    "httpx>=0.27.0",
    "python-dateutil==2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.12.1",
    "ruff==0.1.8",
]

[project.scripts]
diveanalyzer = "src.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/diving-analyser"
Documentation = "https://github.com/yourusername/diving-analyser/wiki"
Repository = "https://github.com/yourusername/diving-analyser.git"
Issues = "https://github.com/yourusername/diving-analyser/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W"]
ignore = ["E501"]  # Line too long (handled by black)
