name: Release

# Tags and releases the version that just landed on `master`. The deploy
# itself is pull-based: ops/auto-deploy.sh on the server fetches this tag and
# runs ci/ship.sh server, so a version only ships once it is tagged here.

on:
  push:
    branches: [master]

permissions:
  contents: write

# Serialize release runs so concurrent merges compute their version after the
# preceding run has pushed its tag, rather than both racing to the same number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute version
        id: version
        run: |
          if ! v="$(python3 ci/version.py next)"; then
            echo "no changes to release" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          python3 ci/version.py body > /tmp/release-body.md

      - name: Tag and publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-body.md
