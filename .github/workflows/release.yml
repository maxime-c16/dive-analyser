name: Release

# Tags and releases the version that just landed on `master`. The deploy
# itself is pull-based: ops/auto-deploy.sh on the server fetches this tag and
# runs ci/ship.sh server, so a version only ships once it is tagged here.

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

# Serialize release runs so concurrent merges compute their version after the
# preceding run has pushed its tag, rather than both racing to the same number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute version
        id: version
        run: |
          set +e
          v="$(python3 ci/version.py next)"
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "no changes to release" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::ci/version.py next failed (exit $rc)"
            exit "$rc"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          python3 ci/version.py body > /tmp/release-body.md

      # Build and push GHCR images BEFORE pushing the release tag so
      # ops/auto-deploy.sh on deb-serv pulls prebuilt images instead of
      # running heavy Docker builds on the 2-core / 5400 rpm host.
      - name: Set up Docker Buildx
        if: steps.version.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        if: steps.version.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.deploy
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dive-analyser-frontend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dive-analyser-frontend:latest
          build-args: |
            APP_SHA=${{ github.sha }}
          labels: |
            dive.analyser/sha=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push backend image
        if: steps.version.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dive-analyser-backend:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dive-analyser-backend:latest
          labels: |
            dive.analyser/sha=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Tag and publish release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-body.md
