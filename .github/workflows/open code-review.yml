name: OpenCode review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # persist-credentials stays enabled (default): the review action
      # shells out to `git fetch origin <branch>`, which needs the
      # token-persisted auth from checkout.
      - uses: actions/checkout@v6

      # Pinned to the commit `latest` pointed at on 2026-10-05: same code,
      # but immune to upstream moves of the tag.
      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/gpt-6-luna
          use_github_token: true
          prompt: |
            Review this pull request. Do not edit files or create commits.
            Report only actionable bugs, security issues, or missing tests.
            For each finding, include severity, file/line, and a concise explanation.
            If there are no actionable findings, say so.
