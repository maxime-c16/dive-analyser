name: CI

# Hosted gate. The pre-push hook enforces correctness locally, but GitHub can't
# see that result; this check gives `master`'s branch protection (and
# auto-merge) a signal it can wait on. It runs the same tiers as a local
# `ci/gate.sh` (fast + frontend + backend + agent) without image builds.

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pinned to the same checkout commit the review workflow already trusts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gate system deps
        run: python -m pip install pyyaml

      - name: Run gate
        run: ci/gate.sh
