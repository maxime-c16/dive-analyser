services:
  funnel-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6091:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Byte-serving of media-cache files via backend X-Accel-Redirect
      # (location /internal-media-cache/ in nginx.conf).
      - ../media/cache:/app/media-cache:ro
    networks:
      - diving

networks:
  diving:
    external: true
    name: diving_network
