# Only published on host loopback; Tailscale Funnel supplies public HTTPS.
# Separate from the LAN nginx, which also serves operator tools.
map $http_upgrade $funnel_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 2G;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "private, no-store" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    # Ignore caller-supplied forwarding chains. Login IP limits share the
    # local Funnel connector's bucket; per-account limits still apply.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;

    location = /_funnel_session {
        internal;
        proxy_pass http://backend:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /api/v1/auth/login {
        proxy_pass http://backend:8000;
    }
    location = /api/v1/auth/me {
        proxy_pass http://backend:8000;
    }
    location = /api/v1/auth/logout {
        proxy_pass http://backend:8000;
    }

    # Gate ALL API routes, including historical analytics routes that have
    # no session dependency. Backend media ownership checks remain active.
    location /api/ {
        auth_request /_funnel_session;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $funnel_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /adminer { return 404; }
    location ^~ /adminer/ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location = /login {
        proxy_pass http://frontend:80;
    }
    location /assets/ {
        proxy_pass http://frontend:80;
    }
    location / {
        auth_request /_funnel_session;
        error_page 401 = @funnel_login;
        proxy_pass http://frontend:80;
    }
    location @funnel_login {
        return 302 /login;
    }
}
