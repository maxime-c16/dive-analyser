# Only published on host loopback; Tailscale Funnel supplies public HTTPS.
# Separate from the LAN nginx, which also serves operator tools.
map $http_upgrade $funnel_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 2G;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "private, no-store" always;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    # Ignore caller-supplied forwarding chains. Login IP limits share the
    # local Funnel connector's bucket; per-account limits still apply.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;

    location = /_funnel_session {
        internal;
        proxy_pass http://backend:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /api/v1/auth/login {
        proxy_pass http://backend:8000;
    }
    location = /api/v1/auth/me {
        proxy_pass http://backend:8000;
    }
    location = /api/v1/auth/logout {
        proxy_pass http://backend:8000;
    }
    # Friend self-registration must be reachable WITHOUT a session (it is
    # how a session is established). Exact matches win over the gated
    # /api/ prefix below, same as login/me/logout.
    location = /api/v1/auth/register {
        proxy_pass http://backend:8000;
    }
    location = /api/v1/auth/registration-status {
        proxy_pass http://backend:8000;
    }

    # Guest capabilities are validated by the backend on every request.
    # An app session would defeat account-free shared links.
    location ^~ /api/v1/shared-dives/ {
        proxy_pass http://backend:8000;
    }

    # "Récupérer mes plongeons" magic link. The emailed button must work for a
    # signed-out visitor: the landing page and its two token-in-body calls are
    # public (the 256-bit single-use token is the credential; the backend
    # redeems it and mints the session). Every other /api/v1/deposits/ route
    # stays behind auth_request via /api/ below.
    location = /api/v1/deposits/claim/peek {
        proxy_pass http://backend:8000;
    }
    location = /api/v1/deposits/claim/redeem {
        proxy_pass http://backend:8000;
    }

    # Gate remaining API routes, including historical analytics routes that have
    # no session dependency. Backend media ownership checks remain active.
    location /api/ {
        auth_request /_funnel_session;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $funnel_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /adminer { return 404; }
    location ^~ /adminer/ { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # Internal byte-serving of verified media-cache files. Reachable only
    # through X-Accel-Redirect responses from the backend — the backend
    # keeps session auth, ownership checks and path verification; nginx
    # streams the file itself (sendfile, native Range/304 handling).
    # Mirrors the LAN front door in nginx/conf.d/default.conf; without it an
    # accelerated media URL falls through to `location /` and the SPA serves
    # index.html instead of the poster or proxy.
    location /internal-media-cache/ {
        internal;
        alias /app/media-cache/;
        add_header Cache-Control "private, max-age=3600";
        add_header Accept-Ranges bytes;
    }

    location = /login {
        proxy_pass http://frontend:80;
    }
    # Public registration page for friend accounts (same treatment as
    # /login: reachable without a session, otherwise location / below
    # bounces unauthenticated visitors to /login before the SPA loads).
    location = /register {
        proxy_pass http://frontend:80;
    }
    # Load the guest SPA before it exchanges the URL-fragment capability.
    location ^~ /share/ {
        proxy_pass http://frontend:80;
    }
    # Magic-link landing page (token lives in the URL fragment, never sent to
    # the server); the SPA calls the public claim endpoints above.
    location = /claim {
        proxy_pass http://frontend:80;
    }
    location /assets/ {
        proxy_pass http://frontend:80;
        # Override the private server-level policy only for versioned assets.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # PWA install files: static, non-sensitive. iOS fetches the manifest and
    # icons outside the app session when adding to Home Screen; leaving them
    # behind auth_request makes Safari render a blank white tile.
    location = /manifest.webmanifest {
        proxy_pass http://frontend:80;
    }
    location = /favicon.ico {
        proxy_pass http://frontend:80;
    }
    location /icons/ {
        proxy_pass http://frontend:80;
    }
    location / {
        auth_request /_funnel_session;
        error_page 401 = @funnel_login;
        proxy_pass http://frontend:80;
    }
    location @funnel_login {
        return 302 /login;
    }
}
